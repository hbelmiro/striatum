name: Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  examples:
    name: Examples
    runs-on: ubuntu-latest

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0

      # uv.lock (examples/docker) is the source of truth for the Python tools
      # the example tests shell out to; Dependabot's uv ecosystem keeps it
      # current. The synced venv is added to PATH for the test run.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Python tools
        run: |
          uv sync --frozen --project examples/docker
          echo "$PWD/examples/docker/.venv/bin" >> "$GITHUB_PATH"

      - name: Run examples integration tests
        env:
          STRIATUM_EXAMPLES_REGISTRY: localhost:5000/examples
          STRIATUM_HOME: ${{ runner.temp }}/striatum-examples
          HOME: ${{ runner.temp }}/examples-home
        run: |
          mkdir -p "$HOME" "$STRIATUM_HOME"
          # Generous timeout: the mlflow test budgets 5 minutes per CLI
          # invocation, which the 10-minute go test default could cut short.
          go test -v -timeout 30m -tags=integration ./examples/...

  # Kept separate from the examples job on purpose:
  # internal/cli/integration_test.go hardcodes registry port 5000, which the
  # examples job's service container already occupies.
  integration:
    name: Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0

      # Same as the examples job: the examples tests shell out to the Python
      # tools in the synced venv (uv.lock is kept current by Dependabot).
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Python tools
        run: |
          uv sync --frozen --project examples/docker
          echo "$PWD/examples/docker/.venv/bin" >> "$GITHUB_PATH"

      - name: Run integration tests
        env:
          STRIATUM_HOME: ${{ runner.temp }}/striatum-integration
          HOME: ${{ runner.temp }}/integration-home
        run: |
          mkdir -p "$HOME" "$STRIATUM_HOME"
          go test -v -timeout 30m -tags=integration ./...
