---
version: 2
updates:
  - package-ecosystem: gomod
    milestone: 6
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    milestone: 6
    directory: /
    schedule:
      interval: daily
    labels:
      - dependencies
      - github-actions
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: pre-commit
    milestone: 6
    directory: /
    schedule:
      interval: daily
    labels:
      - dependencies
      - pre-commit
